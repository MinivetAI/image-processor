<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lifestyle image picker review</title>
<style>
:root{font:14px system-ui,-apple-system,sans-serif;color:#202b3c;background:#f2f4f7}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{border:1px solid #cbd3df;border-radius:8px;background:#fff;color:inherit;padding:8px 12px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.active{background:#243c5a;color:#fff;border-color:#243c5a}.top{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #dce2eb;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top h1{font-size:18px;margin:0 auto 0 0}.top input{max-width:280px}.layout{display:grid;grid-template-columns:310px 1fr;min-height:calc(100vh - 60px)}aside{background:#e9edf3;padding:20px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}main{padding:20px;min-width:0}.nav{display:flex;gap:8px;align-items:center;margin:0 0 14px}.case-id{font-size:21px;font-weight:650;overflow-wrap:anywhere}.muted{color:#637186}.field{margin-top:16px}.field label{display:block;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:#748198;margin-bottom:4px}.field div{overflow-wrap:anywhere}.verdict{display:flex;gap:8px;margin-top:22px}.verdict button{flex:1}.verdict .yes.active{background:#127a50}.verdict .no.active{background:#b63838}.note{width:100%;min-height:70px;margin-top:10px;border:1px solid #cbd3df;border-radius:8px;padding:9px;font:inherit}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.error{white-space:pre-wrap;background:#fce9e6;color:#a82c21;border-radius:8px;padding:12px;margin-bottom:14px}.summary{background:#fff;padding:14px;border:1px solid #dce2eb;border-radius:10px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.card{background:#fff;border:2px solid #dce2eb;border-radius:10px;overflow:hidden}.card.picked{border-color:#16825c;box-shadow:0 0 0 2px #d2f0e2}.thumb{width:100%;height:220px;object-fit:contain;background:#e9edf3;cursor:zoom-in;display:block}.card-body{padding:10px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0}.badge{background:#edf1f6;border-radius:20px;padding:3px 7px;font-size:11px}.badge.selected{background:#d2f0e2;color:#09613e}.badge.warn{background:#fde8dc;color:#9f3b15}.kv{font-size:12px;line-height:1.5;overflow-wrap:anywhere}.kv b{color:#526176}.details{margin-top:14px}.details summary{cursor:pointer}.details pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:55vh;overflow:auto;background:#172232;color:#e5edf7;padding:14px;border-radius:8px}.empty{background:#fff;border:1px dashed #bdc7d6;border-radius:10px;padding:28px;text-align:center;color:#637186}dialog{max-width:95vw;max-height:95vh;border:0;border-radius:10px;padding:8px}dialog img{max-width:90vw;max-height:85vh;object-fit:contain}dialog button{position:absolute;right:12px;top:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{position:static;height:auto}.top{position:static}main{padding:12px}}
</style>
</head>
<body>
<header class="top">
  <h1>Image picker review</h1>
  <input id="file" type="file" accept=".json,.jsonl,application/json">
  <button id="download" disabled>Export review JSON</button>
  <span id="loaded" class="muted">Load a case JSON/JSONL file to begin</span>
</header>
<div class="layout">
  <aside>
    <div class="nav"><button id="prev" disabled>← Prev</button><button id="next" disabled>Next →</button><span id="position" class="muted">0 / 0</span></div>
    <div id="caseId" class="case-id">No cases loaded</div>
    <div id="meta"></div>
    <div class="verdict"><button id="correct" class="yes" disabled>Correct</button><button id="wrong" class="no" disabled>Wrong</button></div>
    <textarea id="note" class="note" placeholder="Review note" disabled></textarea>
  </aside>
  <main>
    <div class="toolbar"><button id="run" class="active" disabled>Run this case through picker</button><span id="status" class="muted">Each click makes one model request.</span></div>
    <div id="content" class="empty">Choose a JSON file containing picker request cases. Each request is sent to this running service.</div>
  </main>
</div>
<dialog id="preview"><button id="closePreview">Close</button><img id="previewImage" alt="Full size catalogue image"></dialog>
<script>
const $=id=>document.getElementById(id);let cases=[],index=0,decisions={};
const keyFor=c=>String(c.case_id||c.fsn||c.product_id||c.request?.product_id||`case-${cases.indexOf(c)+1}`);
function sourceCase(row){const req=row.request||row.input||row;return {meta:{case_id:row.case_id||row.fsn||req.product_id,batch:row.batch,generation:row.generation,created:row.created,orig_verdict:row.orig_verdict||row.original_verdict,vertical:row.cms_vertical||req.cms_vertical,title:row.title||req.title},request:req};}
function parseFile(text,name){if(name.toLowerCase().endsWith('.jsonl'))return text.split(/\r?\n/).filter(x=>x.trim()).map(x=>JSON.parse(x));const v=JSON.parse(text);if(Array.isArray(v))return v;if(Array.isArray(v.cases))return v.cases;throw Error('JSON must be an array of request objects or contain a cases array. Use .jsonl for one case per line.');}
function saveDecision(){if(!cases.length)return;const c=cases[index],k=keyFor(c);decisions[k]={...(decisions[k]||{}),verdict:document.querySelector('.verdict .active')?.id==='correct'?'correct':document.querySelector('.verdict .active')?.id==='wrong'?'wrong':null,note:$('note').value};localStorage.setItem('image-picker-review-decisions',JSON.stringify(decisions));}
function setVerdict(v){document.querySelectorAll('.verdict button').forEach(b=>b.classList.remove('active'));if(v)$(v).classList.add('active');saveDecision();}
function esc(v){return String(v??'—').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function display(){if(!cases.length)return;const c=cases[index],k=keyFor(c),d=decisions[k]||{},res=c.review?.result;$('position').textContent=`${String(index+1).padStart(3,'0')} / ${cases.length}`;$('caseId').textContent=k;$('meta').innerHTML='';for(const [label,value] of Object.entries({generation:c.meta?.generation, batch:c.meta?.batch, created:c.meta?.created, 'orig verdict':c.meta?.orig_verdict, vertical:c.meta?.vertical||c.request?.cms_vertical, title:c.meta?.title, images:c.request?.images?.length, model:c.review?.inference?.model})){if(value==null||value==='')continue;const node=document.createElement('div');node.className='field';node.innerHTML=`<label>${esc(label)}</label><div>${esc(value)}</div>`;$('meta').append(node)}$('prev').disabled=index===0;$('next').disabled=index===cases.length-1;$('run').disabled=false;$('correct').disabled=false;$('wrong').disabled=false;$('note').disabled=false;$('download').disabled=false;$('note').value=d.note||'';setVerdict(d.verdict==='correct'?'correct':d.verdict==='wrong'?'wrong':null);$('status').textContent=c.error?`Request failed: ${c.error}`:res?'Picker result loaded. Mark it correct or wrong.':'Ready; run this case when you want a fresh result.';renderResult(c);}
function renderResult(c){const out=$('content'),r=c.review?.result;if(!r){out.className='empty';out.textContent=c.error||'No result yet. Run this case through the picker.';return}out.className='';const refs=new Map((r.selected_references||[]).map(x=>[x.image_id,x]));const rows=new Map((r.assessments||[]).map(x=>[x.image_id,x]));let html=`<div class="summary"><b>Selected variant:</b> ${esc(r.selected_variant_id)} &nbsp; <b>Selected images:</b> ${[...refs.keys()].map(esc).join(', ')||'none'}<br><b>Unresolved:</b> ${esc((r.unresolved||[]).join(' · ')||'—')}</div><div class="grid">`;
 for(const im of c.request.images||[]){const a=rows.get(im.image_id)||{},ref=refs.get(im.image_id),tags=a.tags||{},ev=new Map((a.evidence||[]).map(x=>[x.tag,x]));html+=`<article class="card ${ref?'picked':''}"><img class="thumb" data-source="${esc(im.source)}" src="${esc(im.source)}" alt="${esc(im.image_id)}"><div class="card-body"><b>${esc(im.image_id)}</b><div class="badges">${ref?`<span class="badge selected">SELECTED · ${esc((ref.roles||[]).join(', '))}</span>`:''}<span class="badge">${esc(a.product_match||'not assessed')}</span><span class="badge">${esc(a.quality||'')}</span></div><div class="kv"><b>Variant IDs:</b> ${esc((a.variant_ids||[]).join(', ')||'—')}<br><b>Duplicate of:</b> ${esc(a.duplicate_of||'—')}<br><b>Tags:</b> ${Object.entries(tags).map(([n,v])=>`${esc(n)}=${esc(v)}`).join(' · ')||'—'}<br><b>Evidence:</b> ${[...ev.values()].map(x=>`${esc(x.tag)}: ${esc(x.detail)}`).join(' · ')||'—'}<br><b>Limitations:</b> ${esc((a.limitations||[]).join(' · ')||'—')}${ref?`<br><b>Selection:</b> ${esc(ref.reason)}`:''}</div></div></article>`}
 html+='</div><details class="details"><summary>Complete API result JSON</summary><pre>'+esc(JSON.stringify(c.review,null,2))+'</pre></details>';out.innerHTML=html;out.querySelectorAll('.thumb').forEach(img=>img.addEventListener('click',()=>{$('previewImage').src=img.dataset.source;$('preview').showModal()}));}
async function runCurrent(){const c=cases[index];$('run').disabled=true;$('status').textContent='Calling image-picker API…';c.error=null;try{const resp=await fetch('/v1/image-processor/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c.request)});const body=await resp.json();if(!resp.ok)throw Error(JSON.stringify(body.detail||body));c.review=body;delete c.review.raw_response;$('status').textContent='Done. Review the selections and mark the case.';}catch(e){c.error=e.message;$('status').textContent=`Request failed: ${e.message}`;}finally{$('run').disabled=false;display();}}
function exportReport(){const report={exported_at:new Date().toISOString(),cases:cases.map(c=>({case_id:keyFor(c),meta:c.meta,request:c.request,review:c.review||null,error:c.error||null,decision:decisions[keyFor(c)]||{}}))};const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='image-picker-review.json';a.click();URL.revokeObjectURL(a.href);}
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const rows=parseFile(await f.text(),f.name);cases=rows.map(sourceCase);if(cases.some(c=>!c.request.images?.length))throw Error('Every case needs an images array.');decisions=JSON.parse(localStorage.getItem('image-picker-review-decisions')||'{}');index=0;$('loaded').textContent=`${cases.length} cases loaded from ${f.name}`;display();}catch(err){$('content').className='error';$('content').textContent=err.message;}});
$('prev').onclick=()=>{saveDecision();index--;display()};$('next').onclick=()=>{saveDecision();index++;display()};$('run').onclick=runCurrent;$('download').onclick=exportReport;$('correct').onclick=()=>setVerdict('correct');$('wrong').onclick=()=>setVerdict('wrong');$('note').addEventListener('input',saveDecision);$('closePreview').onclick=()=>$('preview').close();$('preview').addEventListener('click',e=>{if(e.target===$('preview'))$('preview').close()});
</script>
</body>
</html>
