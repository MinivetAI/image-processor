[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred"
version = "0.2.0"
description = "A tiny, LLM-agnostic library for structured Tasks and tool-calling chat agents."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Aditya" }]
dependencies = [
    "pydantic>=2.0",
    "aiohttp>=3.8",
]

[tool.setuptools]
packages = ["alfred"]
